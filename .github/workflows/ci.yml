name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo build --all-targets
      - run: cargo test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets

  # The whole point of the crate. Fails if anyone adds a dependency.
  no-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - name: assert zero dependencies
        run: |
          n=$(cargo tree --prefix none --no-dedupe | grep -c . )
          echo "cargo tree lines: $n"
          test "$n" -eq 1
